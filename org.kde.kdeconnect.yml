id: org.kde.kdeconnect
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
finish-args:
  - --share=network
  - --socket=x11
  - --share=ipc
  - --own-name=org.kde.kdeconnect-indicator

command: kdeconnect-app
cleanup:
  - '*.a'
  - '*.la'
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/doc
  - /share/man

modules:
  - name: jinja2 #libei
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links=file://${PWD} --prefix=${FLATPAK_DEST} Jinja2 --no-build-isolation
    cleanup:
      - '*'
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/62/a1/3d680cbfd5f4b8f15abc1d571870c5fc3e594bb582bc3b64ea099db13e56/jinja2-3.1.6-py3-none-any.whl
        sha256: 85ece4451f492d0c13c5dd7c13a64681a86afae63a5f347908daf103ce6d2f67
  - name: libevdev # libei
    buildsystem: meson
    config-opts:
      - -Ddocumentation=disabled
      - -Dtests=disabled
    sources:
      - type: archive
        url: https://freedesktop.org/software/libevdev/libevdev-1.14.0.tar.xz
        sha256: 5a0966c7110648665983848bad696c7acba614a2160d2865d535397101007332
  - name: libei #wayland
    buildsystem: meson
    config-opts:
      - -Dtests=disabled
    sources:
      - type: archive
        url: https://gitlab.freedesktop.org/libinput/libei/-/archive/1.6.0/libei-1.6.0.tar.gz
        sha256: 81b4b967f0e5938492434a04f7ea2e6c6d96d3e6c44700bc691821f82281e602
  - name: pulseaudio-qt
    buildsystem: cmake
    sources:
      - type: archive
        url: https://invent.kde.org/libraries/pulseaudio-qt/-/archive/v1.9.0/pulseaudio-qt-v1.9.0.tar.bz2
        sha256: dabef32e90c2ad59256f28adb4a6b089d98927a41846a97269f0c912e5197445
  - name: kpeople
    buildsystem: cmake
    sources:
      - type: archive
        url: https://invent.kde.org/frameworks/kpeople/-/archive/v6.31.0/kpeople-v6.31.0.tar.bz2
        sha256: c12bbce1120cb582650a3d9f178acb35fba56d331da452d033bc0b2d19a12cde
  - name: libfakekey #x11
    buildsystem: autotools
    sources:
      - type: git
        url: https://salsa.debian.org/matchbox-team/libfakekey.git
        commit: 7081b036b4141377146998a59ef8e53f910f7709
  - name: kdeconnect
    buildsystem: cmake
    sources:
      - type: archive
        url: https://invent.kde.org/network/kdeconnect-kde/-/archive/v26.08.2/kdeconnect-kde-v26.08.2.tar.gz
        sha256: bac5ae1a73292e8cef4bf4d800429c7e9032599d4c569aaf517002fc44e3430b




        
