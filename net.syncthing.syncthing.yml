app-id: net.syncthing.syncthing
runtime: org.freedesktop.Platform
sdk: org.freedesktop.Sdk
runtime-version: '26.08'
command: syncthing

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --persist=.syncthing


modules:

  - name: syncthing
    buildsystem: simple
    build-commands:
      - cp -ru ./* /app/
      - mkdir -p /app/bin
      - ln -s /app/syncthing /app/bin/syncthing
    sources:
      - type: archive
        url: https://github.com/syncthing/syncthing/releases/download/v2.1.7/syncthing-linux-amd64-v2.1.7.tar.gz
        sha256: 2edc416e7ed136b7c858ed5f3f02a3b8316589605e54c380228ceea7acbf0142


